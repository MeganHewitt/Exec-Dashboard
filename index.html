<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Megan Hewitt • Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <div class="glow-layer" aria-hidden="true"></div>
    <section class="profile-card" aria-label="Personal link profile card">
      <div class="card-header">
        <div class="avatar" aria-hidden="true"></div>
        <div class="heading-wrap">
          <h1>Megan Hewitt</h1>
          <p>Designing playful web moments with a warm summer glow.</p>
        </div>
      </div>

      <div class="link-list" role="list">
        <a role="listitem" class="link-button" href="https://example.com" target="_blank" rel="noopener noreferrer">
          <span class="link-icon">🌐</span>
          Portfolio
        </a>
        <a role="listitem" class="link-button" href="https://dribbble.com" target="_blank" rel="noopener noreferrer">
          <span class="link-icon">🎨</span>
          Dribbble
        </a>
        <a role="listitem" class="link-button" href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
          <span class="link-icon">💼</span>
          LinkedIn
        </a>
        <a role="listitem" class="link-button" href="mailto:me@example.com">
          <span class="link-icon">✉️</span>
          Email
        </a>
      </div>

      <div class="theme-toggle">
        <span>Light</span>
        <button id="themeSwitch" aria-label="Toggle dark mode" type="button">
          <span class="toggle-knob"></span>
        </button>
        <span>Dark</span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
